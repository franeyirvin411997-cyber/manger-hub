server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://manager:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 支持长连接（AI chat 可能耗时较长）
        proxy_read_timeout 120s;
    }

    location /download/ {
        proxy_pass http://manager:8080/download/;
        proxy_set_header Host $host;
    }

    # WebSocket 代理 — 用于浏览器 VNC (KasmVNC)
    # 前端访问 /vnc/{node_ip}/{port}/ 时代理到实际节点
    location ~ ^/vnc/(?<target_host>[^/]+)/(?<target_port>\d+)/(.*) {
        proxy_pass https://$target_host:$target_port/$3$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # KasmVNC 使用自签证书，忽略验证
        proxy_ssl_verify off;
    }
}
