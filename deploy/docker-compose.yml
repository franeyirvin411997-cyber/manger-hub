version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: mnp_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: platform_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - platform-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  manager:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.go
    container_name: mnp_manager
    restart: always
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: platform_db
      DB_PORT: 5432
      ADMIN_USER: admin
      ADMIN_PASSWORD: admin
      ENCRYPTION_KEY: "mnp-default-key-change-in-prod!!"
    ports:
      - "8002:8080"
      - "50051:50051"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - platform-net
    command: ["/usr/local/bin/manager"]

  node-test1:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.go
    container_name: mnp_node_1
    restart: always
    environment:
      MANAGER_IP: manager
      HOSTNAME: node-test-1
    depends_on:
      - manager
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - platform-net
    command: ["/usr/local/bin/node"]

  web:
    build:
      context: ../web
      dockerfile: ../deploy/Dockerfile.web
    container_name: mnp_web
    restart: always
    ports:
      - "8001:80"
    depends_on:
      - manager
    networks:
      - platform-net

volumes:
  pgdata:

networks:
  platform-net:
    driver: bridge
